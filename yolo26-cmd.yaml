# YOLO26-CMD (Cross-Modal Distillation) 最终优化版
# 核心创新：SPD双浅层无损下采样 + MHP分层多尺度感知 + CAE残差坐标注意力
# 适配：VisDrone航拍小目标检测、YOLO26nano模型、边缘设备部署

nc: 10  # VisDrone数据集类别数（根据你的数据集修改）
scales: 
  n: [0.33, 0.25, 1024]  # 轻量级nano scale，与官方YOLO26n完全对齐
depth_multiple: 0.33
width_multiple: 0.25
max_channels: 1024

# ======================== BACKBONE ========================
# 核心优化：仅在P1/P2浅层使用SPD，保住小目标信息；深层用原生Conv，避免冗余
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                  # 0-P1/2  输入3→64，下采样2倍
  - [-1, 1, SPD_Downsample, [128]]             # 1-P2/4  ✅ 浅层SPD，无损下采样，保住小目标
  - [-1, 3, C3k2, [128, True]]                 # 2      YOLO26原生C3k2，完美加载预训练
  - [-1, 1, SPD_Downsample, [256]]             # 3-P3/8  ✅ 浅层SPD，强化小目标特征保留
  - [-1, 6, C3k2, [256, True]]                 # 4
  - [-1, 1, Conv, [512, 3, 2]]                 # 5-P4/16 深层用原生Conv，避免背景冗余
  - [-1, 6, C3k2, [512, True]]                 # 6
  - [-1, 1, Conv, [1024, 3, 2]]                # 7-P5/32
  - [-1, 3, C3k2, [1024, True]]                # 8
  - [-1, 1, MHP_Block, [1024]]                 # 9      ✅ backbone末端加MHP，强化多尺度语义
  - [-1, 1, SPPF, [1024, 5]]                   # 10     空间金字塔池化，增强感受野

# ======================== HEAD (Neck + Detect) ========================
# 核心优化：分层插入MHP强化多尺度融合、检测头前加CAE强化位置信息
head:
  # P5 → P4 上采样融合
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 11
  - [[-1, 6], 1, Concat, [1]]                  # 12  拼接backbone P4层特征
  - [-1, 3, C3k2, [512, False]]                # 13
  - [-1, 1, MHP_Block, [512]]                  # 14  ✅ P4融合层加MHP，强化中目标特征

  # P4 → P3 上采样融合（小目标核心层）
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 15
  - [[-1, 4], 1, Concat, [1]]                  # 16  拼接backbone P3层特征
  - [-1, 3, C3k2, [256, False]]                # 17  (P3/8-small) 小目标核心特征层
  - [-1, 1, MHP_Block, [256]]                  # 18  ✅ P3融合层加MHP，强化小目标多尺度感知

  # P3检测头前加CAE，强化位置信息，降低漏检
  - [-1, 1, CAE_Module, [256]]                 # 19  ✅ P3检测头前CAE，小目标专属注意力

  # P3 → P4 下采样
  - [-1, 1, Conv, [256, 3, 2]]                 # 20
  - [[-1, 14], 1, Concat, [1]]                 # 21
  - [-1, 3, C3k2, [512, False]]                # 22  (P4/16-medium)
  - [-1, 1, CAE_Module, [512]]                 # 23  ✅ P4检测头前CAE，中目标注意力

  # P4 → P5 下采样
  - [-1, 1, Conv, [512, 3, 2]]                 # 24
  - [[-1, 10], 1, Concat, [1]]                 # 25
  - [-1, 3, C3k2, [1024, False]]               # 26  (P5/32-large)
  - [-1, 1, CAE_Module, [1024]]                # 27  ✅ P5检测头前CAE，大目标注意力

  # 最终检测头，索引完全对齐，无越界
  - [[19, 23, 27], 1, Detect, [nc]]            # 28  Detect(P3, P4, P5)