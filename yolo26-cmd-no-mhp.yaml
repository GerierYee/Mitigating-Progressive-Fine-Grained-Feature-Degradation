# YOLO26-CMD | 去掉MHP | SPD + CAE
nc: 10
scales: 
  n: [0.33, 0.25, 1024]
depth_multiple: 0.33
width_multiple: 0.25
max_channels: 1024

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                  # 0-P1/2
  - [-1, 1, SPD_Downsample, [128]]             # 1-P2/4
  - [-1, 3, C3k2, [128, True]]                 # 2
  - [-1, 1, SPD_Downsample, [256]]             # 3-P3/8
  - [-1, 6, C3k2, [256, True]]                 # 4
  - [-1, 1, Conv, [512, 3, 2]]                 # 5-P4/16
  - [-1, 6, C3k2, [512, True]]                 # 6
  - [-1, 1, Conv, [1024, 3, 2]]                # 7-P5/32
  - [-1, 3, C3k2, [1024, True]]                # 8
  - [-1, 1, SPPF, [1024, 5]]                   # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 10
  - [[-1, 6], 1, Concat, [1]]                  # 11
  - [-1, 3, C3k2, [512, False]]                # 12

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 13
  - [[-1, 4], 1, Concat, [1]]                  # 14
  - [-1, 3, C3k2, [256, False]]                # 15
  - [-1, 1, CAE_Module, [256]]                 # 16

  - [-1, 1, Conv, [256, 3, 2]]                 # 17
  - [[-1, 12], 1, Concat, [1]]                 # 18
  - [-1, 3, C3k2, [512, False]]                # 19
  - [-1, 1, CAE_Module, [512]]                 # 20

  - [-1, 1, Conv, [512, 3, 2]]                 # 21
  - [[-1, 9], 1, Concat, [1]]                  # 22
  - [-1, 3, C3k2, [1024, False]]               # 23
  - [-1, 1, CAE_Module, [1024]]                # 24

  - [[16, 20, 24], 1, Detect, [nc]]