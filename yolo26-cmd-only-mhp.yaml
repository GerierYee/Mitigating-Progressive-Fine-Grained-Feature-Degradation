# YOLO26-CMD | 仅 MHP | 去掉 SPD + 去掉 CAE
nc: 10
scales: 
  n: [0.33, 0.25, 1024]
depth_multiple: 0.33
width_multiple: 0.25
max_channels: 1024

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                 # 1-P2/4 (去掉SPD，用普通Conv)
  - [-1, 3, C3k2, [128, True]]                 # 2
  - [-1, 1, Conv, [256, 3, 2]]                 # 3-P3/8 (去掉SPD，用普通Conv)
  - [-1, 6, C3k2, [256, True]]                 # 4
  - [-1, 1, Conv, [512, 3, 2]]                 # 5-P4/16
  - [-1, 6, C3k2, [512, True]]                 # 6
  - [-1, 1, Conv, [1024, 3, 2]]                # 7-P5/32
  - [-1, 3, C3k2, [1024, True]]                # 8
  - [-1, 1, MHP_Block, [1024]]                 # 9 (保留MHP)
  - [-1, 1, SPPF, [1024, 5]]                   # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 11
  - [[-1, 6], 1, Concat, [1]]                  # 12
  - [-1, 3, C3k2, [512, False]]                # 13
  - [-1, 1, MHP_Block, [512]]                  # 14 (保留MHP)

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 15
  - [[-1, 4], 1, Concat, [1]]                  # 16
  - [-1, 3, C3k2, [256, False]]                # 17
  - [-1, 1, MHP_Block, [256]]                  # 18 (保留MHP)

  - [-1, 1, Conv, [256, 3, 2]]                 # 19
  - [[-1, 14], 1, Concat, [1]]                 # 20
  - [-1, 3, C3k2, [512, False]]                # 21

  - [-1, 1, Conv, [512, 3, 2]]                 # 22
  - [[-1, 10], 1, Concat, [1]]                 # 23
  - [-1, 3, C3k2, [1024, False]]               # 24

  - [[18, 21, 24], 1, Detect, [nc]]