# YOLO26-CMD | 去掉SPD | MHP + CAE
nc: 10
scales: 
  n: [0.33, 0.25, 1024]
depth_multiple: 0.33
width_multiple: 0.25
max_channels: 1024

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                 # 1-P2/4 (普通Conv代替SPD)
  - [-1, 3, C3k2, [128, True]]                 # 2
  - [-1, 1, Conv, [256, 3, 2]]                 # 3-P3/8 (普通Conv代替SPD)
  - [-1, 6, C3k2, [256, True]]                 # 4
  - [-1, 1, Conv, [512, 3, 2]]                 # 5-P4/16
  - [-1, 6, C3k2, [512, True]]                 # 6
  - [-1, 1, Conv, [1024, 3, 2]]                # 7-P5/32
  - [-1, 3, C3k2, [1024, True]]                # 8
  - [-1, 1, MHP_Block, [1024]]                 # 9
  - [-1, 1, SPPF, [1024, 5]]                   # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 11
  - [[-1, 6], 1, Concat, [1]]                  # 12
  - [-1, 3, C3k2, [512, False]]                # 13
  - [-1, 1, MHP_Block, [512]]                  # 14

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 15
  - [[-1, 4], 1, Concat, [1]]                  # 16
  - [-1, 3, C3k2, [256, False]]                # 17
  - [-1, 1, MHP_Block, [256]]                  # 18
  - [-1, 1, CAE_Module, [256]]                 # 19

  - [-1, 1, Conv, [256, 3, 2]]                 # 20
  - [[-1, 14], 1, Concat, [1]]                 # 21
  - [-1, 3, C3k2, [512, False]]                # 22
  - [-1, 1, CAE_Module, [512]]                 # 23

  - [-1, 1, Conv, [512, 3, 2]]                 # 24
  - [[-1, 10], 1, Concat, [1]]                 # 25
  - [-1, 3, C3k2, [1024, False]]               # 26
  - [-1, 1, CAE_Module, [1024]]                # 27

  - [[19, 23, 27], 1, Detect, [nc]]