# YOLO26 Stage I+II: FLP-SPD + P2 Head
# Strict PFGR ablation version
# Removed: MHP_Block, LightASFF, CAE_Module

nc: 10
scales:
  n: [0.33, 0.25, 1024]
depth_multiple: 0.33
width_multiple: 0.25
max_channels: 1024

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                  # 0-P1/2
  - [-1, 1, SPD_Downsample, [128]]             # 1-P2/4
  - [-1, 3, C3k2, [128, True]]                 # 2-P2 feature

  - [-1, 1, SPD_Downsample, [256]]             # 3-P3/8
  - [-1, 6, C3k2, [256, True]]                 # 4-P3 feature

  - [-1, 1, Conv, [512, 3, 2]]                 # 5-P4/16
  - [-1, 6, C3k2, [512, True]]                 # 6-P4 feature

  - [-1, 1, Conv, [1024, 3, 2]]                # 7-P5/32
  - [-1, 3, C3k2, [1024, True]]                # 8-P5 feature
  - [-1, 1, SPPF, [1024, 5]]                   # 9

head:
  # P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 10
  - [[-1, 6], 1, Concat, [1]]                  # 11
  - [-1, 3, C3k2, [512, False]]                # 12 P4 neck

  # P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 13
  - [[-1, 4], 1, Concat, [1]]                  # 14
  - [-1, 3, C3k2, [256, False]]                # 15 P3 neck

  # P3 -> P2, ordinary P2 head without LightASFF
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 16 P3 -> P2
  - [[-1, 2], 1, Concat, [1]]                  # 17 concat with backbone P2
  - [-1, 3, C3k2, [128, False]]                # 18 P2 output

  # P2 -> P3
  - [-1, 1, Conv, [128, 3, 2]]                 # 19
  - [[-1, 15], 1, Concat, [1]]                 # 20
  - [-1, 3, C3k2, [256, False]]                # 21 P3 output

  # P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]                 # 22
  - [[-1, 12], 1, Concat, [1]]                 # 23
  - [-1, 3, C3k2, [512, False]]                # 24 P4 output

  # P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]                 # 25
  - [[-1, 9], 1, Concat, [1]]                  # 26
  - [-1, 3, C3k2, [1024, False]]               # 27 P5 output

  # Detect P2/P3/P4/P5
  - [[18, 21, 24, 27], 1, Detect, [nc]]        # 28
